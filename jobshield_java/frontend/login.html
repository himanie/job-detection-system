<!DOCTYPE html>
<html>

<head>
    <title>JobShield Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            height: 100vh;
            background: linear-gradient(135deg, #020d2b, #040a23, #000c2f);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        /* Navbar */
        .navbar {
            position: absolute;
            top: 0;
            width: 100%;
            padding: 20px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.2);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #8c6cff;
        }

        .login-box {

            width: 350px;
            background: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;

        }

        .login-box h2 {
            margin-bottom: 20px;
        }

        input {

            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 6px;
            background: #0c153d;
            color: white;

        }

        input::placeholder {
            color: #aaa;
        }

        button {

            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border: none;
            border-radius: 6px;
            background: linear-gradient(90deg, #6b7cff, #b86bff);
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;

        }

        button:hover {
            transform: scale(1.05);
        }

        .message {
            margin-top: 15px;
            font-size: 14px;
        }
    </style>

</head>

<body>

    <div class="navbar">
        <div class="logo">🛡 JobShield</div>
    </div>

    <div class="login-box">

        <h2>Login to JobShield</h2>

        <input type="text" id="email" placeholder="Enter Email">

        <input type="password" id="password" placeholder="Enter Password">

        <button id="loginBtn" onclick="login()">Login</button>
        <button onclick="continueWithoutLogin()" style="background:#444;">Continue Without Login
        </button>

        <div class="message" id="message"></div>

    </div>

    <script>

        // 🔐 PAGE LOAD CHECK
        window.onload = function () {

            let status = localStorage.getItem("authStatus");


            // 📢 logout message
            let msg = localStorage.getItem("logoutMsg");
            if (msg) {
                let message = document.getElementById("message");
                message.style.color = "#00ff9d";
                message.innerText = msg;

                localStorage.removeItem("logoutMsg");
            }
        }


        // ⌨️ ENTER KEY LOGIN SUPPORT
        document.addEventListener("keypress", function (e) {
            if (e.key === "Enter") {
                login();
            }
        });


        // ✅ LOGIN FUNCTION
        function login() {

            let email = document.getElementById("email").value.trim();
            let password = document.getElementById("password").value.trim();
            let message = document.getElementById("message");
            let btn = document.getElementById("loginBtn");

            // 🔴 empty check
            if (email === "" || password === "") {
                message.style.color = "orange";
                message.innerText = "Please fill all fields!";
                return;
            }

            // 📧 email validation
            let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailPattern.test(email)) {
                message.style.color = "orange";
                message.innerText = "Enter valid email!";
                return;
            }

            // 🔒 disable button
            btn.disabled = true;
            btn.innerText = "Logging in...";

            // 🌐 BACKEND LOGIN
            fetch("http://127.0.0.1:5000/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    email: email,
                    password: password
                })
            })

                .then(res => {
                    if (!res.ok) throw new Error("Server error");
                    return res.json();
                })

                .then(data => {

                    if (data.message && data.message.toLowerCase().includes("success")) {

                        message.style.color = "#00ff9d";
                        message.innerText = data.message;

                        localStorage.setItem("authStatus", "logged");
                        localStorage.setItem("userEmail", email);
                        localStorage.setItem("userName", email.split("@")[0]);

                        setTimeout(() => {
                            window.location.href = "home.html";
                        }, 800);

                    } else {
                        message.style.color = "#ff4b4b";
                        message.innerText = data.message || "Login failed";
                        resetBtn(btn);
                    }

                })

                .catch(() => {

                    if (email === "admin@gmail.com" && password === "1234") {

                        message.style.color = "#00ff9d";
                        message.innerText = "Demo Login Successful";

                        localStorage.setItem("authStatus", "logged");
                        localStorage.setItem("userEmail", email);
                        localStorage.setItem("userName", "Admin");

                        setTimeout(() => {
                            window.location.href = "home.html";
                        }, 800);

                    } else {
                        message.style.color = "red";
                        message.innerText = "Server not responding or wrong credentials";
                        resetBtn(btn);
                    }
                });

        }

        // 🔄 RESET BUTTON
        function resetBtn(btn) {
            btn.disabled = false;
            btn.innerText = "Login";
        }

        // 👤 CONTINUE WITHOUT LOGIN
        function continueWithoutLogin() {
            localStorage.setItem("authStatus", "guest");
            localStorage.setItem("userName", "Guest");
            window.location.href = "home.html";
        }
    </script>
</body>

</html>
